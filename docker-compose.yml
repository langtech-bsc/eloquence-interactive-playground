services:

  gradio:
    build: 
      context: .
    pull_policy: build
    restart: unless-stopped
    network_mode: host
    environment:
      - OPENAI_API_ENDPOINT_URL=${OPENAI_API_ENDPOINT_URL}
      - ROOT_PATH=/dev
      - ELOQ_PROBE_MODELS_ON_LOAD=false
    volumes:
      - ./playground-data:/data:rw
